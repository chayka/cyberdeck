# DKMS keeps the module rebuilt across kernel upgrades.
#
# This deck gets a new linux-raspi roughly every few weeks, and an out-of-tree
# module built by hand stops loading the moment one lands — silently, because a
# missing power_supply device does not announce itself. It just means the
# battery vanishes from the desktop after a reboot. The Hailo PCIe driver in
# this repo is already installed this way, so `dkms status` stays the one place
# to check what is expected to survive an upgrade.

PACKAGE_NAME="ups-hat-e"
PACKAGE_VERSION="1.0"

BUILT_MODULE_NAME[0]="ups-hat-e"
DEST_MODULE_LOCATION[0]="/kernel/drivers/power/supply"

# KVERSION is passed through rather than relying on the Makefile's `uname -r`
# default: DKMS builds for the kernel being installed, which during an upgrade
# is not the kernel currently running.
MAKE[0]="make KVERSION=${kernelver}"
CLEAN="make clean KVERSION=${kernelver}"

AUTOINSTALL="yes"
